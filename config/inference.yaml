seed: 1
device: cpu

data:
  root: data/Dataset
  test_split: Test
  val_split: Validation
  num_classes: 2
  img_size: 224

models:
  efficientnet_b3:
    output_dir: runs/efficientnet_b3
    transforms:
      eval:
        ensure_rgb: true
        val_resize: true
        val_center_crop: true
    inference:
      weights: weights/efficientnet_b3.pth
      split: Test
      batch_size: 32
      num_workers: 0
      img_size: 224
  efficientformerv2_s1:
    output_dir: runs/efficientformerv2_s1
    transforms:
      eval:
        ensure_rgb: true
        val_resize: true
        val_center_crop: true
    inference:
      weights: weights/efficientformerv2_s1.pth
      split: Test
      batch_size: 32
      num_workers: 0
      img_size: 224
  faster_vit_2_224:
    output_dir: runs/faster_vit_2_224
    transforms:
      eval:
        ensure_rgb: true
        val_resize: true
        val_center_crop: true
    inference:
      weights: weights/faster_vit_2_224.pth
      split: Test
      batch_size: 32
      num_workers: 0
      img_size: 224

selection:
  - efficientformerv2_s1
